<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Naturisa — Mapa de Alimentación</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{
  --primary:#1a3a5c;--primary-light:#2d6a9f;--accent:#00b4d8;
  --bg:#f0f4f8;--card:#ffffff;--text:#1e293b;--muted:#64748b;--border:#e2e8f0;
  --ok:#16a34a;--bad:#dc2626;--warn:#d97706;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text)}

/* ── Login ── */
#login-screen{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;align-items:center;justify-content:center}
.login-card{background:#fff;border-radius:14px;padding:36px 40px;width:340px;box-shadow:0 8px 40px rgba(0,0,0,.15);text-align:center}
.login-card .login-logo{font-size:18px;font-weight:800;color:var(--primary);margin-bottom:4px;letter-spacing:.5px}
.login-card .login-sub{font-size:12px;color:var(--muted);margin-bottom:24px}
.login-card .fg{text-align:left;margin-bottom:14px}
.login-card .fg label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;display:block;margin-bottom:4px}
.login-card .fg input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:7px;font-size:13px}
.login-card .fg input:focus{outline:none;border-color:var(--primary)}
.login-error{color:#b91c1c;font-size:12px;margin-bottom:12px;min-height:16px}
.login-card .btn-login{width:100%;padding:11px;background:var(--primary);color:#fff;border:none;border-radius:7px;font-size:14px;font-weight:700;cursor:pointer;transition:opacity .15s}
.login-card .btn-login:hover{opacity:.88}
.login-card .btn-login:disabled{opacity:.6;cursor:default}

/* ── Layout ── */
#app{display:none;height:100vh;display:flex;flex-direction:column}
.topbar{height:56px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;padding:0 20px;flex-shrink:0}
.topbar .logo{font-weight:800;color:var(--primary);font-size:16px;letter-spacing:.5px}
.topbar .title{font-size:13px;color:var(--muted)}
.topbar .spacer{flex:1}
.fg-inline{display:flex;flex-direction:column;gap:2px}
.fg-inline label{font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.fg-inline select,.fg-inline input{padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:12px;background:#fff}
.btn{padding:8px 16px;border:none;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;background:var(--primary);color:#fff;transition:opacity .15s}
.btn:hover{opacity:.88}
.btn:disabled{opacity:.5;cursor:default}
.btn-user{background:transparent;color:var(--muted);font-weight:600;border:1px solid var(--border)}
.btn-campamento-fin{background:#2563eb;color:#fff}
.tabs{display:flex;gap:4px;background:var(--bg);border-radius:8px;padding:3px}
.tab-btn{border:none;background:transparent;padding:6px 12px;font-size:12px;font-weight:700;color:var(--muted);border-radius:6px;cursor:pointer}
.tab-btn.activo{background:#fff;color:var(--primary);box-shadow:0 1px 3px rgba(0,0,0,.12)}

.resumen{flex:1;overflow:auto;padding:20px 24px}
.resumen-title{font-size:13px;font-weight:700;color:var(--primary);margin-bottom:14px}
.resumen-table-wrap{overflow:auto;border:1px solid var(--border);border-radius:10px;background:#fff}
.resumen-table{border-collapse:collapse;width:100%;font-size:12px}
.resumen-table th,.resumen-table td{padding:9px 14px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap}
.resumen-table th{background:var(--bg);color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.4px;font-weight:700;text-align:right;position:sticky;top:0}
.resumen-table td:first-child,.resumen-table th:first-child{text-align:left;font-weight:700;color:var(--text)}
.resumen-table tr:last-child td{font-weight:800;background:var(--bg)}
.resumen-table td.zero{color:#cbd5e1}
.user-menu{position:relative}
.user-trigger{display:flex;align-items:center;gap:8px;padding:5px 8px 5px 5px;border:1px solid var(--border);border-radius:20px;background:#fff;cursor:pointer;transition:background .15s}
.user-trigger:hover{background:var(--bg)}
.user-avatar{width:28px;height:28px;border-radius:50%;background:var(--bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.user-info{display:flex;flex-direction:column;line-height:1.2;text-align:left}
.user-name{font-size:11px;font-weight:700;color:var(--text)}
.user-name2{font-size:10px;color:var(--muted)}
.user-chevron{font-size:10px;color:var(--muted);transition:transform .15s}
.user-menu:has(.user-dropdown.abierto) .user-chevron{transform:rotate(180deg)}
.user-dropdown{display:none;position:absolute;top:calc(100% + 8px);right:0;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.15);min-width:230px;z-index:600;overflow:hidden;padding:6px}
.user-dropdown.abierto{display:block}
.user-dropdown-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:7px;font-size:12.5px;color:var(--text);cursor:pointer;white-space:nowrap}
.user-dropdown-item:hover{background:var(--bg)}
.user-dropdown-item.danger{color:#dc2626}
.udi-icon{font-size:14px;width:18px;text-align:center}
.user-dropdown-sep{height:1px;background:var(--border);margin:4px 2px}

.main{flex:1;display:flex;overflow:hidden}
#map{flex:1 1 50%;height:100%;min-width:0}
.side{flex:1 1 50%;min-width:0;border-left:1px solid var(--border);background:var(--card);display:flex;flex-direction:column;overflow:hidden}
.side-header{padding:14px 16px 8px;border-bottom:1px solid var(--border);flex-shrink:0}
.side-header .count{font-size:13px;font-weight:800;color:var(--primary)}
.legend{display:flex;gap:14px;padding:8px 16px;font-size:11px;color:var(--muted);border-bottom:1px solid var(--border);flex-shrink:0}
.legend span{display:flex;align-items:center;gap:5px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.dot.ok{background:var(--ok)}
.dot.near{background:var(--warn)}
.dot.bad{background:var(--bad)}


#list{flex:1;overflow-y:auto;padding:6px 10px}
.rec{border:1px solid var(--border);border-left-width:4px;border-radius:8px;padding:9px 11px;margin-bottom:7px;cursor:pointer;transition:background .1s}
.rec:hover{background:var(--bg)}
.rec.sel{background:#eaf2fb}
.rec.ok{border-left-color:var(--ok)}
.rec.near{border-left-color:var(--warn)}
.rec.bad{border-left-color:var(--bad)}
.rec-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.rec-pool{font-size:13px;font-weight:800;color:var(--text)}
.rec-row{display:grid;grid-template-columns:1.3fr 1fr .7fr .8fr;align-items:center;gap:8px;padding:5px 6px;border-radius:6px;cursor:pointer}
.rec-row:hover{background:var(--bg)}
.rec-row.sel{background:#eaf2fb}
.rec-row.rec-head{cursor:default;font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;padding-bottom:2px}
.rec-row.rec-head:hover{background:none}
.rec-tipo{font-size:11px;color:var(--text);font-weight:600}
.rec-user{font-size:11px;color:var(--muted)}
.rec-time{font-size:11px;color:var(--muted)}
.rec-dist{font-size:12px;font-weight:800;text-align:right}
.rec-dist.ok{color:var(--ok)}
.rec-dist.near{color:var(--warn)}
.rec-dist.bad{color:var(--bad)}
.rec-dist.camp{color:#2563eb}
.rec.camp{border-left-color:#2563eb}

.empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:12px}
.loading{position:fixed;inset:0;background:rgba(255,255,255,.7);display:none;align-items:center;justify-content:center;z-index:500;font-weight:700;color:var(--primary)}

.leaflet-tooltip.pool-label{background:transparent;border:none;box-shadow:none;font-weight:800;font-size:11px;color:#fff;text-shadow:0 0 3px #000,0 0 3px #000}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">NATURISA</div>
    <div class="login-sub">Mapa de Alimentación — Acceso AP1</div>
    <div class="fg"><label>Usuario</label><input type="text" id="login-user" placeholder="Usuario AP1" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <div class="fg"><label>Contraseña</label><input type="password" id="login-pass" placeholder="Contraseña AP1" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <div class="login-error" id="login-error"></div>
    <button class="btn-login" id="btn-login" onclick="doLogin()">Ingresar</button>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div class="logo">NATURISA</div>
    <div class="spacer"></div>
    <div class="fg-inline">
      <label>Sucursal</label>
      <select id="sel-sucursal" onchange="cargarDatos()"></select>
    </div>
    <div class="fg-inline">
      <label>Fecha</label>
      <input type="date" id="sel-fecha" onchange="cargarDatos()">
    </div>
    <div class="tabs">
      <button class="tab-btn activo" id="tab-btn-mapa" onclick="cambiarVista('mapa')">Mapa</button>
      <button class="tab-btn" id="tab-btn-resumen" onclick="cambiarVista('resumen')">Resumen por usuario</button>
    </div>
    <button class="btn" onclick="cargarDatos()">Actualizar</button>
    <button class="btn btn-campamento-fin" id="btn-campamento-fin" onclick="finalizarCampamento()" style="display:none">✓ Finalizar área</button>
    <div class="user-menu">
      <button class="user-trigger" id="btn-user" onclick="toggleUserMenu()">
        <span class="user-avatar">👤</span>
        <span class="user-info">
          <span class="user-name" id="user-name-1">&nbsp;</span>
          <span class="user-name2" id="user-name-2">&nbsp;</span>
        </span>
        <span class="user-chevron">▾</span>
      </button>
      <div class="user-dropdown" id="user-dropdown">
        <div class="user-dropdown-item" onclick="toggleUserMenu(false); toggleMarcarCampamento()"><span class="udi-icon">📍</span> Marcar área de campamento</div>
        <div class="user-dropdown-sep"></div>
        <div class="user-dropdown-item danger" onclick="logout()"><span class="udi-icon">⏻</span> Cerrar sesión</div>
      </div>
    </div>
  </div>

  <div class="main" id="vista-mapa">
    <div id="map"></div>
    <div class="side">
      <div class="side-header">
        <div class="count" id="side-count">Registros (0)</div>
      </div>
      <div id="list"><div class="empty">Selecciona sucursal y fecha, luego "Actualizar".</div></div>
    </div>
  </div>

  <div class="resumen" id="vista-resumen" style="display:none">
    <div class="resumen-title">Dosis registradas por usuario — dentro del polígono, en campamento y por rango de distancia al borde</div>
    <div class="resumen-table-wrap">
      <table class="resumen-table" id="resumen-table"></table>
    </div>
  </div>
</div>

<div class="loading" id="loading">Cargando…</div>

<script>
// ── Config AP1 ──────────────────────────────────────────────────────────
// Se llama vía el proxy local (comun/server.py), que reenvía /bff/* al gateway
// sin las restricciones de CORS que bloquean la llamada directa desde el navegador.
const AUTH_URL  = '/bff/web/ap1/security/api/auth';
const CODE_APP  = '55ab9cb4-c887-4f42-98ec-b90470be6613';
const API_BASE  = '/bff/web/ap1/backoffice/api';
const FEED_BASE = '/bff/mobile/feedcontrol/balanceado/api';
const NEAR_POOL_M = 20; // tolerancia por error GPS / muros angostos entre piscinas

let TOKEN = null, USERNAME = null;
let SUBSIDIARIES = [];
let POOLS = [];      // [{code, points:[[lat,lon],...], centroid:[lat,lon], status}]
let RECORDS = [];    // registros de action_location_logs con poolCode
let map = null, poolLayers = [], markerLayers = [], distanceLine = null;
let campamento = null;         // [[lat,lng], ...] área dibujada por el usuario, por sucursal
let campamentoLayer = null;
let marcandoCampamento = false;
let campamentoDraft = [];      // vértices en construcción mientras se marca
let campamentoDraftLayer = null;
let selectedRecId = null;

// ── Geofencing (portado de ubicame-app/src/geofence.js) ────────────────
function pointInPolygon(lat, lon, points) {
  let inside = false;
  for (let i = 0, j = points.length - 1; i < points.length; j = i++) {
    const [latI, lonI] = points[i];
    const [latJ, lonJ] = points[j];
    const intersect = (lonI > lon) !== (lonJ > lon) &&
      lat < ((latJ - latI) * (lon - lonI)) / (lonJ - lonI) + latI;
    if (intersect) inside = !inside;
  }
  return inside;
}
// Distancia (m) y punto [lat,lon] más cercano del borde del polígono, en un solo recorrido.
function nearestEdgePoint(lat, lon, points) {
  const kLat = 111320;
  const kLon = 111320 * Math.cos((lat * Math.PI) / 180);
  let minSq = Infinity, bestX = 0, bestY = 0;
  for (let i = 0, j = points.length - 1; i < points.length; j = i++) {
    const ax = (points[j][1] - lon) * kLon, ay = (points[j][0] - lat) * kLat;
    const bx = (points[i][1] - lon) * kLon, by = (points[i][0] - lat) * kLat;
    const dx = bx - ax, dy = by - ay;
    const lenSq = dx * dx + dy * dy;
    const t = lenSq ? Math.max(0, Math.min(1, -(ax * dx + ay * dy) / lenSq)) : 0;
    const px = ax + dx * t, py = ay + dy * t;
    const distSq = px * px + py * py;
    if (distSq < minSq) { minSq = distSq; bestX = px; bestY = py; }
  }
  return { distanceM: Math.sqrt(minSq), point: [lat + bestY / kLat, lon + bestX / kLon] };
}
// Ubica un punto GPS respecto a UNA piscina de referencia (la del registro, por poolCode).
// distanceM = distancia del registro al borde del polígono, siempre en metros
// (dentro o fuera); inside indica si el punto cae dentro del polígono; edgePoint
// es el punto exacto del borde más cercano, para dibujar la línea de distancia.
function locateAgainstPool(lat, lon, pool) {
  if (!pool || !pool.points || pool.points.length < 3) return { estado: 'sin-poligono', distanceM: null, inside: null, edgePoint: null };
  const inside = pointInPolygon(lat, lon, pool.points);
  const { distanceM: d, point: edgePoint } = nearestEdgePoint(lat, lon, pool.points);
  if (inside) return { estado: 'ok', distanceM: d, inside: true, edgePoint };
  return { estado: d <= NEAR_POOL_M ? 'near' : 'bad', distanceM: d, inside: false, edgePoint };
}

// ── Auth ─────────────────────────────────────────────────────────────
async function ap1Login(user, pass) {
  const res = await fetch(AUTH_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
    body: JSON.stringify({ userName: user, password: pass, codeApplication: CODE_APP, includeUserInfo: true })
  });
  const json = await res.json();
  if (json.code !== 200 || !json.data?.token) throw new Error(json.message || 'Login fallido');
  return { token: json.data.token, usuario: json.data.usuario || null };
}
async function ap1Get(path) {
  const res = await fetch(API_BASE + path, { headers: { Authorization: 'Bearer ' + TOKEN, Accept: 'application/json' } });
  if (!res.ok) throw new Error('Error ' + res.status + ' en ' + path);
  return res.json();
}
async function feedGet(path) {
  const res = await fetch(FEED_BASE + path, { headers: { Authorization: 'Bearer ' + TOKEN, Accept: 'application/json' } });
  if (!res.ok) throw new Error('Error ' + res.status + ' en ' + path);
  return res.json();
}

async function doLogin() {
  const user = document.getElementById('login-user').value.trim();
  const pass = document.getElementById('login-pass').value;
  const err = document.getElementById('login-error');
  const btn = document.getElementById('btn-login');
  err.textContent = '';
  if (!user || !pass) { err.textContent = 'Ingresa usuario y contraseña'; return; }
  btn.disabled = true; btn.textContent = 'Ingresando…';
  try {
    const login = await ap1Login(user, pass);
    TOKEN = login.token;
    USERNAME = user;
    sessionStorage.setItem('mapaAlim_user', user);
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    const u = login.usuario;
    document.getElementById('user-name-1').textContent = u?.firstNames || user;
    document.getElementById('user-name-2').textContent = u?.lastNames || '';
    await initApp();
  } catch (e) {
    err.textContent = 'No se pudo iniciar sesión: ' + e.message;
  } finally {
    btn.disabled = false; btn.textContent = 'Ingresar';
  }
}
function logout() {
  TOKEN = null; USERNAME = null;
  sessionStorage.removeItem('mapaAlim_user');
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('login-pass').value = '';
  toggleUserMenu(false);
}

function toggleUserMenu(forzar) {
  const dd = document.getElementById('user-dropdown');
  const abrir = typeof forzar === 'boolean' ? forzar : !dd.classList.contains('abierto');
  dd.classList.toggle('abierto', abrir);
}
document.addEventListener('click', (e) => {
  if (!e.target.closest('.user-menu')) toggleUserMenu(false);
});

// ── Carga de datos ──────────────────────────────────────────────────
async function initApp() {
  map = L.map('map', { zoomControl: true }).setView([-3.44, -80.05], 15);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 21, attribution: 'Esri'
  }).addTo(map);
  map.on('click', (e) => {
    if (!marcandoCampamento) return;
    campamentoDraft.push([e.latlng.lat, e.latlng.lng]);
    redrawCampamentoDraft();
  });

  const json = await ap1Get('/subsidiaries?pageSize=100');
  SUBSIDIARIES = json?.data?.data || json?.data || [];
  const sel = document.getElementById('sel-sucursal');
  sel.innerHTML = SUBSIDIARIES
    .filter(s => s.type === 'FINCA' || s.type === 'CAMARONERA' || true)
    .sort((a,b) => (a.name||'').localeCompare(b.name||''))
    .map(s => `<option value="${s.idSubsidiary}">${s.name}</option>`).join('');

  const savedSub = localStorage.getItem('mapaAlim_sub');
  if (savedSub && SUBSIDIARIES.some(s => String(s.idSubsidiary) === savedSub)) sel.value = savedSub;

  const hoy = new Date().toISOString().slice(0,10);
  document.getElementById('sel-fecha').value = hoy;

  await cargarDatos();
}

function parsePolygon(polygon) {
  // AP1 devuelve GeoJSON: coordinates = [ [lng, lat], ... ]. Se invierte a [lat, lng].
  const coords = polygon?.coordinates;
  if (!Array.isArray(coords) || coords.length < 3) return null;
  return coords.map(c => [c[1], c[0]]);
}

async function cargarPiscinas(idSucursal) {
  const json = await ap1Get(`/pools?subsidiaryIds=${idSucursal}&pageSize=5000&status=ACTIVO&status=INACTIVO&status=MANTENIMIENTO`);
  const rows = json?.data?.data || [];
  return rows.map(p => {
    const points = parsePolygon(p.polygon);
    const cLat = points ? points.reduce((s,c)=>s+c[0],0)/points.length : null;
    const cLon = points ? points.reduce((s,c)=>s+c[1],0)/points.length : null;
    return { code: p.codePool, name: p.name, size: p.size, status: p.status, points, centroid: points ? [cLat,cLon] : null };
  }).filter(p => p.code);
}

async function cargarRegistros(idSucursal, fecha) {
  const json = await feedGet(`/action_location_logs?initDate=${fecha}&endDate=${fecha}&subsidiaryId=${idSucursal}`);
  const rows = json?.data?.data || json?.data || [];
  return rows.filter(r => r.poolCode && typeof r.latitude === 'number' && typeof r.longitude === 'number');
}

// ── Área de campamento (polígono dibujado a mano, persistido por sucursal) ──
function campamentoKey(idSucursal) { return 'mapaAlim_campamento_area_' + idSucursal; }

function cargarCampamento(idSucursal) {
  campamento = null;
  if (campamentoLayer) { map.removeLayer(campamentoLayer); campamentoLayer = null; }
  const raw = localStorage.getItem(campamentoKey(idSucursal));
  if (!raw) return;
  try {
    const points = JSON.parse(raw);
    if (Array.isArray(points) && points.length >= 3) dibujarCampamento(points);
  } catch (e) {}
}

function dibujarCampamento(points) {
  campamento = points;
  if (campamentoLayer) map.removeLayer(campamentoLayer);
  campamentoLayer = L.polygon(points, {
    color: '#2563eb', weight: 2, fillColor: '#2563eb', fillOpacity: 0.18, dashArray: '4,4'
  }).addTo(map);
  campamentoLayer.bindTooltip('Campamento', { permanent: true, direction: 'center', className: 'pool-label' });
}

function redrawCampamentoDraft() {
  if (campamentoDraftLayer) map.removeLayer(campamentoDraftLayer);
  if (campamentoDraft.length < 2) {
    campamentoDraftLayer = campamentoDraft.length === 1
      ? L.circleMarker(campamentoDraft[0], { radius: 5, color: '#2563eb' }).addTo(map)
      : null;
    return;
  }
  campamentoDraftLayer = L.polyline(campamentoDraft, { color: '#2563eb', weight: 2, dashArray: '4,4' }).addTo(map);
}

function toggleMarcarCampamento(forzar) {
  marcandoCampamento = typeof forzar === 'boolean' ? forzar : !marcandoCampamento;
  document.getElementById('btn-campamento-fin').style.display = marcandoCampamento ? '' : 'none';
  document.getElementById('map').style.cursor = marcandoCampamento ? 'crosshair' : '';
  if (!marcandoCampamento) {
    campamentoDraft = [];
    if (campamentoDraftLayer) { map.removeLayer(campamentoDraftLayer); campamentoDraftLayer = null; }
  }
}

function finalizarCampamento() {
  if (campamentoDraft.length < 3) { alert('Marca al menos 3 puntos para formar el área del campamento.'); return; }
  const idSucursal = document.getElementById('sel-sucursal').value;
  localStorage.setItem(campamentoKey(idSucursal), JSON.stringify(campamentoDraft));
  dibujarCampamento(campamentoDraft);
  toggleMarcarCampamento(false);
  renderTodo();
}

async function cargarDatos() {
  const idSucursal = document.getElementById('sel-sucursal').value;
  const fecha = document.getElementById('sel-fecha').value;
  if (!idSucursal || !fecha) return;
  localStorage.setItem('mapaAlim_sub', idSucursal);
  cargarCampamento(idSucursal);
  document.getElementById('loading').style.display = 'flex';
  try {
    const [pools, records] = await Promise.all([
      cargarPiscinas(idSucursal),
      cargarRegistros(idSucursal, fecha)
    ]);
    POOLS = pools;
    const poolByCode = new Map(pools.map(p => [p.code, p]));
    RECORDS = records.map(r => {
      const pool = poolByCode.get(r.poolCode);
      const loc = locateAgainstPool(r.latitude, r.longitude, pool);
      const enCampamento = !!campamento && pointInPolygon(r.latitude, r.longitude, campamento);
      return { ...r, pool, estado: loc.estado, distanceM: loc.distanceM, inside: loc.inside, edgePoint: loc.edgePoint, enCampamento };
    }).sort((a,b) => (a.appCreatedAt||'').localeCompare(b.appCreatedAt||''));
    renderTodo();
  } catch (e) {
    alert('Error cargando datos: ' + e.message);
  } finally {
    document.getElementById('loading').style.display = 'none';
  }
}

// ── Render ───────────────────────────────────────────────────────────
function poolColor(status) {
  if (status === 'ACTIVO') return '#16a34a';
  if (status === 'MANTENIMIENTO') return '#d97706';
  if (status === 'INACTIVO') return '#dc2626';
  return '#94a3b8';
}
function markerColor(estado) {
  if (estado === 'ok') return '#16a34a';
  if (estado === 'near') return '#d97706';
  if (estado === 'bad') return '#dc2626';
  return '#64748b';
}
function colorOf(r) { return r.enCampamento ? '#2563eb' : markerColor(r.estado); }
function fmtMeters(d) {
  return d < 1000 ? Math.round(d) + ' m' : (d/1000).toFixed(2) + ' km';
}
function fmtDist(r) {
  if (r.enCampamento) return 'En campamento';
  if (r.distanceM === null || r.distanceM === undefined) return 'sin polígono de referencia';
  if (r.inside) return 'Dentro del polígono';
  return fmtMeters(r.distanceM);
}

function renderTodo() {
  poolLayers.forEach(l => map.removeLayer(l));
  markerLayers.forEach(l => map.removeLayer(l));
  poolLayers = []; markerLayers = [];
  if (distanceLine) { map.removeLayer(distanceLine); distanceLine = null; }

  const bounds = [];
  POOLS.forEach(p => {
    if (!p.points) return;
    const poly = L.polygon(p.points, {
      color: '#1a3a5c', weight: 1, fillColor: poolColor(p.status), fillOpacity: 0.28
    }).addTo(map);
    poly.bindTooltip(p.code.replace(/^\w+-0*/, ''), { permanent: true, direction: 'center', className: 'pool-label' });
    poolLayers.push(poly);
    p.points.forEach(pt => bounds.push(pt));
  });

  const filtered = RECORDS;

  filtered.forEach(r => {
    const m = L.circleMarker([r.latitude, r.longitude], {
      radius: 6, color: '#fff', weight: 1.5, fillColor: colorOf(r), fillOpacity: 0.95
    }).addTo(map);
    m.bindPopup(popupHtml(r));
    m.on('click', () => selectRecord(r.idActionLocationLog));
    markerLayers.push(m);
    bounds.push([r.latitude, r.longitude]);
  });

  document.getElementById('side-count').textContent = `Registros (${filtered.length})`;

  if (bounds.length) map.fitBounds(bounds, { padding: [30,30] });

  renderList(filtered);
  renderResumen();
}

// ── Vista "Resumen por usuario" ─────────────────────────────────────
const RANGOS_DIST = [
  { label: '0–20 m',   min: 0,   max: 20 },
  { label: '20–50 m',  min: 20,  max: 50 },
  { label: '50–100 m', min: 50,  max: 100 },
  { label: '100–250 m',min: 100, max: 250 },
  { label: '250+ m',   min: 250, max: Infinity },
];

function cambiarVista(v) {
  document.getElementById('vista-mapa').style.display = v === 'mapa' ? 'flex' : 'none';
  document.getElementById('vista-resumen').style.display = v === 'resumen' ? 'block' : 'none';
  document.getElementById('tab-btn-mapa').classList.toggle('activo', v === 'mapa');
  document.getElementById('tab-btn-resumen').classList.toggle('activo', v === 'resumen');
  if (v === 'mapa' && map) setTimeout(() => map.invalidateSize(), 50);
}

function renderResumen() {
  const table = document.getElementById('resumen-table');
  const dosis = RECORDS.filter(r => r.entityType === 'FEED_DETAIL');
  if (!dosis.length) { table.innerHTML = '<tr><td style="padding:16px;color:var(--muted)">Sin registros de dosis para esta sucursal/fecha.</td></tr>'; return; }

  const porUsuario = new Map();
  dosis.forEach(r => {
    const user = r.createdBy || '—';
    if (!porUsuario.has(user)) {
      porUsuario.set(user, { total: 0, dentro: 0, campamento: 0, sinPoligono: 0, rangos: RANGOS_DIST.map(() => 0) });
    }
    const fila = porUsuario.get(user);
    fila.total++;
    if (r.enCampamento) fila.campamento++;
    else if (r.inside) fila.dentro++;
    else if (r.distanceM === null || r.distanceM === undefined) fila.sinPoligono++;
    else {
      const idx = RANGOS_DIST.findIndex(rg => r.distanceM >= rg.min && r.distanceM < rg.max);
      if (idx >= 0) fila.rangos[idx]++;
    }
  });

  const usuarios = [...porUsuario.entries()].sort((a,b) => b[1].total - a[1].total);
  const totales = { total: 0, dentro: 0, campamento: 0, sinPoligono: 0, rangos: RANGOS_DIST.map(() => 0) };
  usuarios.forEach(([, f]) => {
    totales.total += f.total; totales.dentro += f.dentro; totales.campamento += f.campamento; totales.sinPoligono += f.sinPoligono;
    f.rangos.forEach((n, i) => totales.rangos[i] += n);
  });

  const cell = (n) => `<td class="${n === 0 ? 'zero' : ''}">${n}</td>`;
  const filaHtml = (nombre, f) => `<tr>
      <td>${nombre}</td>
      <td>${f.total}</td>
      ${cell(f.dentro)}
      ${cell(f.campamento)}
      ${f.rangos.map(cell).join('')}
      ${cell(f.sinPoligono)}
    </tr>`;

  table.innerHTML = `
    <thead><tr>
      <th>Usuario</th>
      <th>Total dosis</th>
      <th>Dentro del polígono</th>
      <th>En campamento</th>
      ${RANGOS_DIST.map(r => `<th>${r.label}</th>`).join('')}
      <th>Sin polígono</th>
    </tr></thead>
    <tbody>
      ${usuarios.map(([nombre, f]) => filaHtml(nombre, f)).join('')}
      ${filaHtml('Total', totales)}
    </tbody>`;
}

function popupHtml(r) {
  const hora = (r.appCreatedAt||'').slice(11,16);
  return `<b>${r.poolCode}</b> — ${tipoLabel(r)}<br>
    ${hora} · ${r.sacks ?? '?'} sacos (${r.kilograms ?? '?'} kg)<br>
    Usuario: ${r.createdBy||'—'}<br>
    <b style="color:${colorOf(r)}">${fmtDist(r)}</b>${r.accuracyMeters?` <span style="color:#94a3b8">(precisión GPS ±${r.accuracyMeters}m)</span>`:''}`;
}

function estadoLabel(r) {
  if (r.estado === 'sin-poligono') return 'Sin polígono de piscina para comparar';
  return fmtDist(r);
}

function tipoLabel(r) {
  if (r.entityType === 'FEED_TRANSFER_DETAIL') return 'Entrega de viaje';
  if (r.entityType === 'FEED_DETAIL') return 'Dosis';
  return r.actionCode || r.entityType || '—';
}

function clsOf(r) {
  if (r.enCampamento) return 'camp';
  return r.estado === 'ok' ? 'ok' : r.estado === 'near' ? 'near' : r.estado === 'bad' ? 'bad' : '';
}

function renderList(records) {
  const list = document.getElementById('list');
  if (!records.length) { list.innerHTML = '<div class="empty">Sin registros de alimentación para este filtro.</div>'; return; }

  const byPool = new Map();
  records.forEach(r => {
    if (!byPool.has(r.poolCode)) byPool.set(r.poolCode, []);
    byPool.get(r.poolCode).push(r);
  });
  const groups = [...byPool.entries()].sort((a,b) => a[1][0].appCreatedAt.localeCompare(b[1][0].appCreatedAt));

  list.innerHTML = groups.map(([poolCode, recs]) => {
    const worst = recs.reduce((w, r) => (r.estado === 'bad' || (r.estado === 'near' && w.estado !== 'bad')) ? r : w, recs[0]);
    const rows = recs.map(r => `<div class="rec-row${r.idActionLocationLog===selectedRecId?' sel':''}" onclick="focusRecord(${r.idActionLocationLog})">
        <span class="rec-tipo">${tipoLabel(r)}</span>
        <span class="rec-user">${r.createdBy||'—'}</span>
        <span class="rec-time">${(r.appCreatedAt||'').slice(11,16)}</span>
        <span class="rec-dist ${clsOf(r)}">${fmtDist(r)}</span>
      </div>`).join('');
    return `<div class="rec ${clsOf(worst)}">
      <div class="rec-top"><span class="rec-pool">${poolCode}</span></div>
      <div class="rec-row rec-head">
        <span>Tipo</span><span>Usuario</span><span>Hora</span><span style="text-align:right">Distancia</span>
      </div>
      ${rows}
    </div>`;
  }).join('');
}

function selectRecord(id) { selectedRecId = id; renderList(RECORDS); }
function focusRecord(id) {
  const r = RECORDS.find(x => x.idActionLocationLog === id);
  if (!r) return;
  selectRecord(id);
  map.setView([r.latitude, r.longitude], 19);
  markerLayers.forEach(m => {
    const ll = m.getLatLng();
    if (Math.abs(ll.lat - r.latitude) < 1e-9 && Math.abs(ll.lng - r.longitude) < 1e-9) m.openPopup();
  });

  if (distanceLine) { map.removeLayer(distanceLine); distanceLine = null; }
  if (r.edgePoint && !r.inside) {
    distanceLine = L.polyline([[r.latitude, r.longitude], r.edgePoint], {
      color: colorOf(r), weight: 2, dashArray: '6,6'
    }).addTo(map);
    distanceLine.bindTooltip(fmtDist(r), { permanent: true, direction: 'center', className: 'pool-label' });
  }
}

// ── Arranque ─────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  const savedUser = sessionStorage.getItem('mapaAlim_user');
  if (savedUser) document.getElementById('login-user').value = savedUser;
});
</script>
